name: Firmware build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  platformio-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Create local build configuration from template
        run: cp config/config.example.h config/config.h

      - name: Compile ESP8266 firmware
        run: pio run
